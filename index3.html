<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHome</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Доброе утро! %username%</h1>
    <div class="contain">
        <div class="card1 w1">
            <h2>Темп. внутри</h2>
            <h3>25℃</h3>
        </div>
        <div class="card1 w2">
            <h2>Темп. снаружи</h2>
            <h3>12℃</h3>
        </div>
        <div class="card1 w3">
            <h2>Влажность</h2>
            <h3>38%</h3>
        </div>
        <div class="card1 w4">
            <h2>Эл. энергия</h2>
            <h3>67кВч</h3>
        </div>
    </div>
    <div class="contain2">
        <div class="card">
            <h3>Чайник</h3>
            <img class="imgs" src="kettle.png" alt="Типа ЧАААААААААЙНИК">
        </div>
        <div class="card">
            <h3>Колонка</h3>
            <img class="imgs" src="speaker.png" alt="Типа КОЛООООООНКА">
        </div>
        <div class="card">
            <h3>Увлажнитель</h3>
            <img class="imgs" src="humid.png" alt="Типа УВЛАЖНИИИИИИИИТЕЛЬ">
        </div>
        <div class="card">

        </div>
    </div>
</body>

</html>
